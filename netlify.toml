# Production branch is `production` (moved by the release workflow after
# approval); `main` is the staging branch deploy. version.txt lets the
# pipeline tell when a commit is live.
[build]
  command = 'make build && mkdir -p dist && echo "$COMMIT_REF" > dist/version.txt'
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `make dev`: Netlify CLI proxies Vite (5173) and the functions on 8888.
# Explicit, because the package.json `dev` script is `netlify dev` itself.
[dev]
  command = "npx vite --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[context.production]
  environment = { SDLC_ENV = "production" }

[context.branch-deploy]
  environment = { SDLC_ENV = "staging" }

[context.deploy-preview]
  environment = { SDLC_ENV = "preview" }

# API routes → functions. GITHUB_TOKEN is set by a person in Netlify for the
# production and branch-deploy contexts only; previews run in fixture mode.
[[redirects]]
  from = "/api/flow"
  to = "/.netlify/functions/flow"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200

# SPA fallback. Existing files (index.html, assets, version.txt) win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
